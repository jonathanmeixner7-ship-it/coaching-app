<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jonathan Coaching</title>
<meta name="theme-color" content="#0B0D0C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Coaching">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: eine Handy-Spalte (max 520px), dunkles Sport-Design, Karten, feste Tab-Leiste unten. Bewusst nur ein (dunkles) Thema. */
:root{
  --bg:#0B0D0C; --card:#15191A; --card2:#1D2224; --fg:#F2F5F3; --muted:#8E9A96; --line:#262D2F;
  --accent:#3DDC84; --accent-ink:#06210F; --accent-soft:#12301F; --warm:#FF7A3D; --warm-soft:#33190C;
  --done:#3DDC84; --danger:#FF6B5E; --sil:#262C2E; --muscle:#363E41;
  --display:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --body:"Atkinson Hyperlegible", "Helvetica Neue", Arial, sans-serif;
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 120px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:2rem;font-weight:900;font-style:italic;font-stretch:112%;text-transform:uppercase;line-height:1.02}
h2{font-size:1.3rem;font-weight:800;font-style:italic;font-stretch:112%}
h3{font-size:1.05rem;font-weight:800}
.muted{color:var(--muted)} .small{font-size:.88rem}
.label{font-family:var(--display);font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800;font-stretch:100%}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center} .between{justify-content:space-between}
.card{background:var(--card);border-radius:20px;padding:16px}
.card.hi{background:linear-gradient(160deg,var(--accent-soft),var(--card) 60%)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:12px 18px;font-family:var(--display);font-weight:800;font-size:1rem;min-height:50px;letter-spacing:.02em}
.btn.warm{background:var(--warm);color:#1F0A00}
.btn.ghost{background:var(--card2);color:var(--fg)}
.btn.link{background:none;color:var(--muted);padding:6px;min-height:auto;text-decoration:underline;font-family:var(--body);font-weight:400;font-size:.95rem}
.btn:disabled{opacity:.5}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[data-muscle]:focus-visible{outline:3px solid var(--warm);outline-offset:2px}
input,select,textarea{background:var(--card2);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-height:46px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.formrow{display:flex;gap:10px;flex-wrap:wrap}
.sheet{border-top:1px solid var(--line);padding-top:12px}
hr.sep{border:0;border-top:1px solid var(--line);margin:0}

/* Kopf */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:8px 14px}
.avatar{flex:none;width:44px;height:44px;border-radius:50%;background:var(--card2);color:var(--accent);display:grid;place-items:center;font-family:var(--display);font-weight:900;border:0}

/* Wochenleiste */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.sd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.72rem;color:var(--muted);font-weight:700}
.sd i{font-style:normal;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--fg);font-family:var(--display);font-weight:800;font-size:.95rem;border:2px solid transparent}
.sd.today i{border-color:var(--accent)}
.sd.full i{background:var(--accent);color:var(--accent-ink)}
.sd.part i{background:var(--warm-soft);color:var(--warm)}
.sd.rest i{opacity:.55}

/* Tagesring */
.today-head{display:flex;gap:16px;align-items:center}
.ring{flex:none}
.ring text{font-family:var(--display);font-weight:900;fill:var(--fg)}
.coachmsg{background:var(--card);border-radius:20px;padding:14px 16px;border-left:4px solid var(--accent)}

/* Aufgaben */
.task{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border:0;border-radius:18px;padding:14px;min-height:72px}
.task .box{flex:none;width:36px;height:36px;border-radius:11px;border:2.5px solid var(--muted);display:grid;place-items:center}
.task.is-done .box{background:var(--done);border-color:var(--done)}
.task.is-done .box::after{content:"";width:9px;height:16px;border:solid var(--accent-ink);border-width:0 3.5px 3.5px 0;transform:translateY(-2px) rotate(45deg)}
.task.is-done .t-title{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted)}
.task .go{flex:none;font-family:var(--display);font-weight:900;font-style:italic;color:var(--accent);font-size:.85rem}
.t-body{min-width:0;flex:1} .t-title{font-weight:700;display:block}
.chip{display:inline-block;font-size:.76rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--card2);color:var(--muted)}
.chip.ems{background:var(--warm-soft);color:var(--warm)}
.chip.ausdauer,.chip.kraft{background:var(--accent-soft);color:var(--accent)}
.reminder{background:var(--warm-soft);color:var(--fg);border-radius:16px;padding:12px 14px}

/* Männchen */
.bodypair{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bodylabel{text-align:center;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
svg.body{width:100%;height:auto;max-height:340px;display:block}
svg.body .sil{fill:var(--sil)}
svg.body .m{fill:var(--muscle);stroke:var(--bg);stroke-width:1.2}
svg.body .m.warm{fill:#24804F}
svg.body .m.hot{fill:var(--accent);filter:drop-shadow(0 0 5px rgba(61,220,132,.55))}
svg.body [data-muscle]{cursor:pointer}
svg.body .ring{fill:none;stroke:var(--accent);stroke-width:2.2;filter:drop-shadow(0 0 4px rgba(61,220,132,.7))}
.musclelist{display:flex;flex-wrap:wrap;gap:6px}
.measures{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mbox{background:var(--card2);border-radius:14px;padding:10px 12px}
.mbox b{display:block;font-family:var(--display);font-size:1.35rem;font-weight:900;font-variant-numeric:tabular-nums}
.delta{font-size:.8rem;font-weight:700} .delta.good{color:var(--accent)} .delta.bad{color:var(--warm)}
.bodywrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:12px;align-items:center}

/* Übungen */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.fchip{flex:none;border:0;border-radius:99px;padding:8px 14px;background:var(--card);color:var(--muted);font-weight:700;min-height:40px}
.fchip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.exitem{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:0;border-radius:18px;padding:10px 14px 10px 10px}
.exitem .thumb{flex:none;width:56px;height:76px;border-radius:12px;background:var(--card2);padding:4px}
.exitem .thumb svg{max-height:68px}
.routine{display:flex;flex-direction:column;gap:10px;background:linear-gradient(150deg,#1B3A2A,var(--card) 70%);border-radius:20px;padding:16px}
.routines{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,78%);gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.routines > *{scroll-snap-align:start}
.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}

/* Training (Vollbild) */
.overlay{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;-webkit-overflow-scrolling:touch}
.overlay .wrap{padding-top:calc(12px + env(safe-area-inset-top,0px))}
.setrow{display:grid;grid-template-columns:56px 1fr 84px 52px;gap:8px;align-items:center}
.setrow .n{font-family:var(--display);font-weight:800;color:var(--muted)}
.setrow input{min-height:42px;padding:8px;text-align:center}
.setbtn{width:48px;height:48px;border-radius:14px;border:2.5px solid var(--muted);background:none;display:grid;place-items:center}
.setbtn.on{background:var(--accent);border-color:var(--accent)}
.setbtn.on::after{content:"";width:9px;height:16px;border:solid var(--accent-ink);border-width:0 3.5px 3.5px 0;transform:translateY(-2px) rotate(45deg)}
.timer{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card2);border-radius:24px 24px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -10px 40px rgba(0,0,0,.5)}
.timer .in{max-width:520px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.timer b{font-family:var(--display);font-size:2.6rem;font-weight:900;font-style:italic;font-variant-numeric:tabular-nums}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent)}

/* Zahlen */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border-radius:16px;padding:12px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:1.7rem;font-weight:900;font-style:italic;font-variant-numeric:tabular-nums}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:99px}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.daylist{display:flex;flex-direction:column}
.dayline{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.dayline:last-child{border-bottom:0}

/* Erfolge */
.badges{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.badge{background:var(--card);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px;opacity:.6}
.badge .medal{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:900;background:var(--card2);color:var(--muted)}
.badge.got{opacity:1;background:linear-gradient(150deg,var(--warm-soft),var(--card) 70%)}
.badge.got .medal{background:var(--warm);color:#1F0A00}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(11,13,12,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;padding:10px 2px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.74rem;font-weight:700;color:var(--muted);min-height:62px}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}

/* Allgemein */
.pick{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border:0;border-radius:18px;padding:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:700;max-width:90vw;z-index:40}
.auth{max-width:420px;margin:0 auto;padding-top:28px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:11px;padding:10px;font-weight:700;color:var(--muted);min-height:44px}
.seg button[aria-pressed="true"]{background:var(--card2);color:var(--fg)}
.err{color:var(--danger);font-weight:700;margin:0} .ok{color:var(--accent);font-weight:700;margin:0}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.credit{font-size:.75rem;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:no-preference){.task,.bar span,.progress span,.setbtn{transition:background .2s,border-color .2s,width .4s}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">Lädt …</div></div>
<nav class="tabs" id="tabs" hidden><div class="in" id="tabsIn"></div></nav>
<div id="layer"></div>
<div class="toast" id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="body.js"></script>
<script src="exercises.js"></script>
<script src="app.js"></script>
</body>
</html>
