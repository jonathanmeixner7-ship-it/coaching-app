<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jonathan Coaching</title>
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Coaching">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="icon" href="icon-192.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<style>
/* Layout: eine Handy-Spalte (max 560px) im Stil von Apple Fitness/Health – große Titel, gruppierte Listen, Aktivitätsringe, Milchglas-Tab-Leiste. Hell und dunkel nach Handy-Einstellung. */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --card2:#F2F2F7; --fill:rgba(120,120,128,.12); --fg:#000000; --muted:#8A8A8E; --line:rgba(60,60,67,.14);
  --tint:#C8102E; --on-tint:#FFFFFF; --tint-soft:rgba(200,16,46,.10); --accent:#E0283A; --warm:#FF7A1A; --warm-soft:rgba(255,149,0,.14); --danger:#FF3B30; --done:#34C759;
  --ring1:#FA114F; --ring2:#4CD964; --ring3:#1EC8D8;
  --sil:#E3E3E8; --muscle:#CFCFD6; --muscle-warm:#A9E3B8; --fig-near:#9C9CA4; --fig-far:#CBCBD1; --fig-hl:.32; --glass:rgba(249,249,251,.8);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --fill:rgba(120,120,128,.24); --fg:#FFFFFF; --muted:#8E8E93; --line:rgba(84,84,88,.6);
  --tint:#FF4D5E; --on-tint:#FFFFFF; --tint-soft:rgba(255,77,94,.16); --accent:#FF3B4D; --warm:#FF9F0A; --warm-soft:rgba(255,159,10,.16); --danger:#FF453A; --done:#30D158;
  --sil:#2C2C2E; --muscle:#3A3A3C; --muscle-warm:#1F6B35; --fig-near:#6C6C72; --fig-far:#3A3A3C; --fig-hl:.14; --glass:rgba(22,22,24,.78);
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --fill:rgba(120,120,128,.24); --fg:#FFFFFF; --muted:#8E8E93; --line:rgba(84,84,88,.6);
  --tint:#FF4D5E; --on-tint:#FFFFFF; --tint-soft:rgba(255,77,94,.16); --accent:#FF3B4D; --warm:#FF9F0A; --warm-soft:rgba(255,159,10,.16); --danger:#FF453A; --done:#30D158;
  --sil:#2C2C2E; --muscle:#3A3A3C; --muscle-warm:#1F6B35; --fig-near:#6C6C72; --fig-far:#3A3A3C; --fig-hl:.14; --glass:rgba(22,22,24,.78);
  --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.4;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 120px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:2.125rem;font-weight:700;letter-spacing:-.025em;line-height:1.1}
h2{font-size:1.375rem;font-weight:700;letter-spacing:-.02em;line-height:1.2}
h3{font-size:1.0625rem;font-weight:600;letter-spacing:-.015em}
.muted{color:var(--muted)} .small{font-size:.875rem;letter-spacing:-.005em}
.label{font-size:.8125rem;text-transform:uppercase;letter-spacing:.02em;color:var(--muted);font-weight:500}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center} .between{justify-content:space-between}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.card.hi{background:var(--card)}
.section{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:10px}
.section h2{font-size:1.375rem}
button,select,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
button:active{transform:scale(.98)}
.btn{background:var(--tint);color:var(--on-tint);border:0;border-radius:14px;padding:13px 20px;font-weight:600;font-size:1.0625rem;min-height:50px;transition:transform .12s, opacity .2s}
.btn.warm{background:var(--warm);color:#fff}
.btn.ghost{background:var(--tint-soft);color:var(--tint)}
.btn.link{background:none;color:var(--tint);padding:6px 4px;min-height:auto;font-weight:400;font-size:1rem}
.btn:disabled{opacity:.5}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[data-muscle]:focus-visible{outline:3px solid var(--tint);outline-offset:2px}
input,select,textarea{background:var(--fill);border:0;border-radius:12px;padding:12px 14px;width:100%;min-height:48px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.formrow{display:flex;gap:10px;flex-wrap:wrap}
.sheet{border-top:.5px solid var(--line);padding-top:12px}
hr.sep{border:0;border-top:.5px solid var(--line);margin:0}
details summary{color:var(--tint);font-weight:500;list-style:none} details summary::-webkit-details-marker{display:none}

/* Kopf: großer Titel wie in iOS */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding-block:14px 12px}
.top .label{margin-bottom:2px}
.avatar{flex:none;width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#FF3B44,#8B0016);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:1rem;border:0}

/* Wochenleiste */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--card);border-radius:22px;padding:12px 8px;box-shadow:var(--shadow)}
.sd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.75rem;color:var(--muted);font-weight:500}
.sd i{font-style:normal;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--fg);font-weight:600;font-size:.9375rem;font-variant-numeric:tabular-nums}
.sd.today i{background:var(--fg);color:var(--bg)}
.sd.full i{box-shadow:inset 0 0 0 3px var(--done)}
.sd.today.full i{background:var(--done);color:#fff;box-shadow:none}
.sd.part i{box-shadow:inset 0 0 0 3px var(--warm)}
.sd.rest i{color:var(--muted)}

/* „Als Nächstes“, Serie, Rekorde, Rückmeldung, Konfetti */
.nextcard{display:grid;grid-template-columns:112px minmax(0,1fr);gap:14px;align-items:center;background:var(--card);border-radius:22px;padding:14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.nextcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,#FF5A66,#7A0012)}
.nextcard.done::before{background:var(--done)}
.nc-media{width:112px;height:112px;border-radius:16px;overflow:hidden;background:var(--card2);display:grid;place-items:center}
.nc-media .photoanim{border-radius:16px}
.nc-media svg.anim{max-height:108px}
.nc-icon{width:112px;height:112px;border-radius:16px;background:var(--card2);display:grid;place-items:center;font-size:2.6rem}
.nc-icon.ok{background:var(--done);color:#fff;font-weight:800}
.nc-body{display:flex;flex-direction:column;gap:6px;min-width:0}
.nc-body h2{font-size:1.2rem}
.nc-body .btn{align-self:flex-start;min-height:42px;padding:9px 16px;font-size:.9375rem;margin-top:4px}
.streakline{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:.875rem;padding-top:10px;border-top:.5px solid var(--line)}
.streakline b{font-size:1.15rem}
.flame{width:16px;height:20px;background:linear-gradient(180deg,#FF9F0A,#E0283A);clip-path:path('M8 0C9 5 15 7 15 13A7 7 0 0 1 1 13C1 9 4 7 5 4C6 7 7 8 8 8C8 5 7 3 8 0Z')}
.joker{margin-left:auto;font-size:.75rem;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--tint-soft);color:var(--tint)}
.joker.used{background:var(--fill);color:var(--muted)}
.lastline{font-size:.8125rem;color:var(--muted);margin-top:2px}
.prbadge{display:inline-block;align-self:flex-start;font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:99px;background:linear-gradient(90deg,#7A0012,#E0283A);color:#fff;margin-top:4px}
.rpe{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.rpeb{border:0;border-radius:10px;min-height:40px;background:var(--fill);font-weight:700;font-variant-numeric:tabular-nums}
.rpeb.on{background:var(--tint);color:var(--on-tint)}
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.moodb{border:0;border-radius:14px;background:var(--fill);padding:8px 2px;font-size:.6875rem;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:58px}
.moodb span{font-size:1.4rem;line-height:1.2}
.moodb.on{background:var(--tint-soft);box-shadow:inset 0 0 0 2px var(--tint)}
.dc .dcq{display:flex;flex-direction:column;gap:6px}
.dc .row.dcq{flex-direction:row}
.dcb{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.dcb .moodb{min-height:46px}
.stepb{border:0;width:40px;height:40px;border-radius:50%;background:var(--fill);font-size:1.3rem;font-weight:700;color:var(--fg)}
.glasses{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.glasses i{height:8px;border-radius:3px;background:var(--fill);transform:skewX(-18deg)}
.glasses i.on{background:linear-gradient(90deg,#1E6FD9,#4FA3FF)}
.dcsum{display:flex;align-items:center;gap:12px;text-align:left;border:0;width:100%;color:var(--fg);font:inherit;cursor:pointer}
.dcok{flex:0 0 32px;height:32px;border-radius:50%;background:var(--done);color:#fff;display:grid;place-items:center;font-weight:800}
.adot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.adot.rot{background:var(--danger)} .adot.gelb{background:#FFC400} .adot.gruen{background:var(--done)}
.adot.onav{position:absolute;right:-2px;bottom:-2px;width:13px;height:13px;box-shadow:0 0 0 2px var(--card)}
.ampelsum{display:flex;gap:14px;flex-wrap:wrap;font-size:.875rem}
.ampelsum span{display:flex;align-items:center;gap:6px}
.ampelwhy{display:block;margin-top:4px;font-size:.8125rem;font-weight:600}
.ampelwhy.rot{color:var(--danger)} .ampelwhy.gelb{color:var(--warm)} .ampelwhy.gruen{color:var(--done)}
.ampelline{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.9375rem;padding:10px 14px;border-radius:14px;background:var(--fill)}
.dctable{display:grid;grid-template-columns:auto repeat(6,1fr);gap:4px 8px;font-size:.8125rem;text-align:center;align-items:center}
.dctable span:nth-child(-n+7){color:var(--muted);font-size:.6875rem;font-weight:600}
.dctable span:nth-child(7n+1){text-align:left;color:var(--muted)}
.tk-fill.water{background:linear-gradient(90deg,#0B4FB3,#1E6FD9 60%,#5AB0FF)}
.stepb.water{width:auto;white-space:nowrap;padding:0 16px;border-radius:20px;font-size:1rem;background:rgba(30,111,217,.14);color:#1E6FD9}
.btn.link.inline{display:inline;min-height:0;padding:0;font-size:inherit;text-align:left}
.foodgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.food{display:flex;align-items:center;gap:8px;border:0;background:var(--card);box-shadow:var(--shadow);border-radius:16px;padding:10px;text-align:left;color:var(--fg);font:inherit;min-height:60px;cursor:pointer}
.food:active{transform:scale(.97)}
.food .fe{font-size:1.5rem;flex:0 0 auto}
.food .fn{display:flex;flex-direction:column;min-width:0;flex:1;font-size:.8125rem;line-height:1.25;overflow-wrap:anywhere}
.food .fp{font-weight:800;font-style:italic;color:var(--tint);font-size:.875rem;white-space:nowrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{border:0;border-radius:99px;background:var(--fill);padding:8px 14px;font:inherit;font-size:.8125rem;font-weight:600;color:var(--fg);white-space:nowrap;cursor:pointer}
.fchip.on{background:var(--tint);color:var(--on-tint)}
.rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rcard{border:0;padding:0;background:var(--card);box-shadow:var(--shadow);border-radius:18px;overflow:hidden;text-align:left;color:var(--fg);font:inherit;display:block;cursor:pointer}
.rcard img{width:100%;height:auto;aspect-ratio:3/2;object-fit:cover;display:block;background:var(--fill)}
.rcard .rtxt{display:flex;flex-direction:column;gap:2px;padding:10px 12px 12px;font-size:.875rem;line-height:1.25}
.boost{gap:16px}
.bt{display:flex;gap:12px;align-items:flex-start}
.bt .bi{flex:0 0 40px;height:40px;border-radius:12px;background:var(--fill);display:grid;place-items:center;font-size:1.3rem}
.bt .small{margin-top:2px}
.refs{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px}
.reflink{font-size:.75rem;font-weight:600;color:var(--tint);text-decoration:none}
.reflink::before{content:"📄 "}
.recipe .rhero{position:relative}
.recipe .rhero img{width:100%;aspect-ratio:3/2;max-height:46vh;object-fit:cover;display:block;background:var(--fill)}
.recipe .rclose{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;width:40px;height:40px;min-height:0;padding:0;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;border:0;backdrop-filter:blur(8px)}
.recipe a,.small a{color:var(--tint)}
.dotb{flex:0 0 6px;height:6px;border-radius:50%;background:var(--tint);margin-top:2px}
.stepn{flex:0 0 26px;height:26px;border-radius:50%;background:var(--tint-soft);color:var(--tint);display:grid;place-items:center;font-weight:800;font-size:.8125rem}
.spinwrap{position:relative;border-radius:18px;overflow:hidden;background:#111}
.spin{width:100%;max-width:340px;margin:0 auto;aspect-ratio:300/540;background-size:600% 600%;background-repeat:no-repeat;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none;display:grid;place-items:center}
.spin:active{cursor:grabbing}
.spin.loading{background:var(--fill);border-radius:18px}
.spinhint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(0,0,0,.55);color:#fff;font-size:.75rem;font-weight:600;padding:6px 12px;border-radius:99px;backdrop-filter:blur(8px);pointer-events:none;white-space:nowrap}
.spinup{align-self:center;cursor:pointer}
.spinempty{background:var(--fill);border-radius:16px;padding:14px}
.spintrim{border-radius:18px;overflow:hidden;background:#111;max-width:200px;margin:0 auto;width:100%}
.spintrim img{width:100%;aspect-ratio:54/96;object-fit:cover;display:block}
input[type=range]{width:100%;accent-color:var(--tint)}
.fb{display:flex;flex-direction:column;gap:2px}
.fbnote{font-size:.875rem;font-style:italic}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
/* Tageskarte: Tempo-Balken (MX-Stil) */
.tk-num{font-family:var(--display);font-weight:900;font-style:italic;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.tk-bars{display:flex;flex-direction:column;gap:14px}
.tk-bar .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:.8125rem;font-weight:600;color:var(--muted);margin-bottom:6px}
.tk-bar .lbl b{font-size:1.5rem;color:var(--fg)}
.tk-track{position:relative;height:16px;background:var(--fill);border-radius:4px;transform:skewX(-18deg);overflow:hidden;margin-inline:3px}
.tk-fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#7A0012,#E0283A 70%,#FF5A66);border-radius:4px}
.tk-fill::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 18px,rgba(255,255,255,.18) 18px 21px)}
@media (prefers-reduced-motion:no-preference){.tk-fill{animation:tkgrow .9s cubic-bezier(.2,.8,.2,1) both}@keyframes tkgrow{from{width:0}}}
/* Aktivitätsringe */
.today-head{display:flex;gap:18px;align-items:center}
.rings{flex:none}
.ringlegend{display:flex;flex-direction:column;gap:6px;min-width:0}
.ringlegend .lg{display:flex;flex-direction:column}
.ringlegend .lg span{font-size:.8125rem;font-weight:600}
.ringlegend .lg b{font-family:var(--display);font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ringlegend .lg b small{font-size:.8125rem;color:var(--muted);font-weight:500}
.ring{flex:none}
.ring text{font-family:var(--display);font-weight:700;fill:var(--fg)}
.coachmsg{background:var(--card);border-radius:22px;padding:14px 16px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:flex-start}
.coachmsg .avatar{width:34px;height:34px;font-size:.875rem}

/* Gruppierte Liste (wie iOS-Einstellungen) */
.list{background:var(--card);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
.list > .task{border-radius:0;box-shadow:none;background:transparent;position:relative}
.list > .task + .task::before{content:"";position:absolute;top:0;left:64px;right:0;border-top:.5px solid var(--line)}
.task{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border:0;border-radius:22px;padding:14px 16px;min-height:72px}
.task .box{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;opacity:.8}
.task.is-done .box{background:var(--done);border-color:var(--done);opacity:1}
.task.is-done .box::after{content:"";width:7px;height:13px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.task.is-done .t-title{color:var(--muted)}
.task .go{flex:none;background:var(--tint);color:var(--on-tint);font-weight:600;font-size:.875rem;padding:7px 14px;border-radius:99px}
.t-body{min-width:0;flex:1} .t-title{font-weight:600;display:block;font-size:1.0625rem}
.chip{display:inline-block;font-size:.75rem;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--fill);color:var(--muted)}
.chip.ems{background:var(--warm-soft);color:var(--warm)}
.chip.ausdauer,.chip.kraft{background:var(--tint-soft);color:var(--tint)}
.reminder{background:var(--warm-soft);color:var(--fg);border-radius:18px;padding:12px 14px}

/* Männchen (Muskelkarte) */
.bodypair{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bodylabel{text-align:center;font-size:.75rem;color:var(--muted);font-weight:500}
.rbody{position:relative;width:100%;max-width:190px;margin:0 auto;aspect-ratio:200/369}
.rbody img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;-webkit-user-select:none;user-select:none;pointer-events:none}
.rbody .rover{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:multiply;overflow:visible}
.rbody .m{fill:transparent;transition:fill .25s}
.rbody .m.hot{fill:#FF3B30;fill-opacity:.8}
.rbody .m.warm{fill:#FF9500;fill-opacity:.55}
.rbody.tap .m{cursor:pointer}
.rbody.tap .m:not(.hot):not(.warm):hover{fill:#FF3B30;fill-opacity:.25}
.routine .mini .bodypair{display:flex;justify-content:center;gap:6px;height:100%}
.routine .mini .bodypair > div{height:100%}
.routine .mini .rbody{height:100%;width:auto;max-width:none}
.routine .mini .bodylabel{display:none}
svg.body{width:100%;height:auto;max-height:320px;display:block}
svg.body .sil{fill:var(--sil)}
svg.body .m{fill:var(--muscle);stroke:var(--card);stroke-width:1.2}
svg.body .m.warm{fill:var(--muscle-warm)}
svg.body .m.hot{fill:var(--accent)}
svg.body [data-muscle]{cursor:pointer}
svg.body .ring{fill:none;stroke:var(--accent);stroke-width:2.2}
.musclelist{display:flex;flex-wrap:wrap;gap:6px}
.measures{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mbox{background:var(--card2);border-radius:16px;padding:10px 12px}
.mbox b{display:block;font-family:var(--display);font-size:1.375rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.delta{font-size:.8125rem;font-weight:600} .delta.good{color:var(--tint)} .delta.bad{color:var(--warm)}
.bodywrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:12px;align-items:center}

/* Übungen */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.fchip{flex:none;border:0;border-radius:99px;padding:8px 16px;background:var(--card);color:var(--fg);font-weight:500;min-height:38px;box-shadow:var(--shadow)}
.fchip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.exlist{background:var(--card);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
.exitem{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:transparent;border:0;padding:10px 16px 10px 10px;position:relative}
.exitem + .exitem::before{content:"";position:absolute;top:0;left:104px;right:0;border-top:.5px solid var(--line)}
.exitem::after{content:"›";color:var(--muted);font-size:1.5rem;font-weight:300;margin-left:auto}
.exitem .thumb{flex:none;width:80px;height:80px;border-radius:14px;background:var(--card2);padding:2px;display:grid;place-items:center;overflow:hidden}
.exitem .thumb svg{max-height:76px}
.exitem .thumb .photoanim{border-radius:12px}
.exrow{display:flex;align-items:center;position:relative}
.exrow + .exrow::before{content:"";position:absolute;top:0;left:104px;right:0;border-top:.5px solid var(--line)}
.exrow .exitem{flex:1;min-width:0;padding-right:4px}
.exrow .exitem::after{display:none}
.pickbtn{flex:none;width:40px;height:40px;margin-right:12px;border-radius:50%;border:1.5px solid var(--tint);background:transparent;color:var(--tint);font-size:1.35rem;font-weight:500;line-height:1;cursor:pointer}
.pickbtn.on{background:var(--tint);color:var(--on-tint, #fff)}
.swapbox{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:16px;background:var(--card2)}
.swapitem{display:flex;gap:12px;align-items:center;text-align:left;border:0;background:var(--card);border-radius:14px;padding:6px 12px 6px 6px;color:var(--fg);font:inherit;cursor:pointer}
.swapitem .sthumb{flex:none;width:56px;height:56px;border-radius:12px;background:var(--card2);overflow:hidden;display:grid;place-items:center}
.swapitem .sthumb svg{max-height:54px}
.seg.seg3{grid-template-columns:repeat(3,1fr)}
.seg.seg3 button[aria-pressed="true"]{background:var(--tint);color:var(--on-tint);box-shadow:none}
.rbody .m.rec-red{fill:#FF3B30;fill-opacity:.8}
.rbody .m.rec-yel{fill:#FFCC00;fill-opacity:.7}
.rbody .m.rec-grn{fill:#34C759;fill-opacity:.45}
.reclegend{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;font-size:.8125rem;color:var(--muted)}
.reclegend span{display:flex;align-items:center;gap:6px}
.rdot{width:10px;height:10px;border-radius:50%;display:inline-block}
.rdot.rec-red{background:#FF3B30}.rdot.rec-yel{background:#FFCC00}.rdot.rec-grn{background:#34C759}
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none}
.shareprev{width:min(260px,70%);margin:0 auto;display:block;border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.histrow{display:flex;gap:14px;align-items:center;padding:12px 16px;position:relative}
.histrow + .histrow::before{content:"";position:absolute;top:0;left:70px;right:0;border-top:.5px solid var(--line)}
.hdate{flex:none;width:40px;text-align:center;line-height:1.1}
.hdate b{display:block;font-size:1.25rem}
.hdate span{font-size:.75rem;color:var(--muted);text-transform:uppercase}
.hkg{flex:none;font-weight:700;font-size:1.15rem}
.hkg span{font-size:.75rem;font-weight:500;color:var(--muted)}
.routine{position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;min-height:300px;padding-top:170px !important;border-radius:24px;padding:16px;overflow:hidden;color:#fff;background:linear-gradient(160deg,#2B2D31,#141516)}
.routine .mini{position:absolute;left:0;right:0;top:0;height:170px;width:auto;background:none;border-radius:0;padding:10px 10px 0}
.routine .mini svg{height:100%;max-height:none;width:100%}
.routine .mini .photoanim{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;border-radius:0}
.routine::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.55));pointer-events:none}
.routine > *:not(.mini):not(.coverimg){position:relative;z-index:1}
.routine.cover{padding-top:16px !important;min-height:340px;background:#07142E}
.routine .coverimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.routine.cover::after{background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.8))}
.routine .label{color:rgba(255,255,255,.75)}
.routine .muted{color:rgba(255,255,255,.75)}
.routine > .row{position:absolute;left:16px;right:16px;top:14px;z-index:2}
.routine .btn{align-self:flex-start;min-height:40px;padding:8px 18px;font-size:.9375rem;background:#fff;color:#000}
.routine svg.anim .near .sk{fill:#8E8E93} .routine svg.anim .far .sk{fill:#48484A}
.routine svg.anim .ground{stroke:rgba(255,255,255,.12)}
.routines{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,74%);gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;scroll-padding-inline:16px}
.routines > *{scroll-snap-align:start}
.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:8px}

/* Animiertes Männchen */
svg.anim{width:100%;height:auto;display:block}
svg.anim line{stroke-linecap:round}
svg.anim .ground{stroke:var(--line);stroke-width:2}
svg.anim .shadow{fill:#000;opacity:.12}
svg.anim .near .sk{fill:var(--fig-near)} svg.anim .far .sk{fill:var(--fig-far)}
svg.anim .near.warm .sk{fill:#FF8A8A} svg.anim .far.warm .sk{fill:#B34A52}
svg.anim .near.hot .sk{fill:var(--accent)} svg.anim .far.hot .sk{fill:#9E1426}
svg.anim .hl{stroke:#fff;opacity:var(--fig-hl)}
svg.anim .hair{fill:#3A2E28}
svg.anim .prop{fill:var(--fill)} svg.anim .prop-line{fill:none;stroke:var(--muted);stroke-width:4;opacity:.6}
svg.anim .weight{fill:var(--warm)} svg.anim .band{stroke:var(--warm)} svg.anim .pole{stroke:var(--muted)}
.animbox{background:var(--card);border-radius:24px;padding:10px;box-shadow:var(--shadow)}
.animbox svg{max-height:300px;margin:0 auto}
.photoanim{position:relative;width:100%;aspect-ratio:1;border-radius:18px;overflow:hidden;background:#2a2d2f}
.animbox .photoanim{max-width:380px;margin:0 auto}
.photoanim img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.photoanim img.b{animation:vormachen 2.8s ease-in-out infinite}
@keyframes vormachen{0%,22%{opacity:0}42%,72%{opacity:1}92%,100%{opacity:0}}
.exhead{display:grid;grid-template-columns:92px minmax(0,1fr);gap:14px;align-items:center}
.exhead .mini{background:var(--card2);border-radius:16px;padding:2px;overflow:hidden}

/* Training (Vollbild) */
.overlay{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;-webkit-overflow-scrolling:touch}
.overlay .wrap{padding-top:calc(8px + env(safe-area-inset-top,0px))}
.setrow{display:grid;grid-template-columns:52px 1fr 84px 48px;gap:8px;align-items:center}
.setrow .n{font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.setrow input{min-height:40px;padding:8px;text-align:center}
.setbtn{width:44px;height:44px;border-radius:50%;border:2px solid var(--muted);background:none;display:grid;place-items:center}
.setbtn.on{background:var(--done);border-color:var(--done)}
.setbtn.on::after{content:"";width:8px;height:15px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translateY(-2px) rotate(45deg)}
.timer{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line);padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.timer .in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.timer b{font-family:var(--display);font-size:2.75rem;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.progress{height:6px;background:var(--fill);border-radius:99px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--tint)}

/* Zahlen */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border-radius:20px;padding:14px 12px;box-shadow:var(--shadow)}
.stat b{display:block;font-family:var(--display);font-size:1.75rem;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.bar{height:10px;background:var(--fill);border-radius:99px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--tint);border-radius:99px}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.daylist{display:flex;flex-direction:column;padding-block:4px}
.dayline{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:.5px solid var(--line)}
.dayline:last-child{border-bottom:0}
details.dp{display:block;padding:0}
details.dp > summary{display:flex;justify-content:space-between;gap:10px;padding:12px 0;cursor:pointer;list-style:none;color:var(--fg);font-weight:400}
details.dp > summary::-webkit-details-marker{display:none}
.chev{width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-2px);transition:transform .2s}
details.dp[open] .chev{transform:rotate(225deg) translateY(-2px)}
.dp-body{display:flex;flex-direction:column;gap:12px;padding:0 0 14px}
.dp-unit{display:flex;flex-direction:column;gap:8px}
.dp-list{background:var(--card2);border-radius:14px;overflow:hidden}
.dp-ex{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:9px 12px;font-size:.9375rem;position:relative}
.dp-ex + .dp-ex::before{content:"";position:absolute;top:0;left:44px;right:0;border-top:.5px solid var(--line)}
.dp-n{font-weight:700;color:var(--tint);font-variant-numeric:tabular-nums;font-style:italic}
.dp-name{min-width:0;line-height:1.25}
.dp-sr{color:var(--muted);font-size:.8125rem;font-variant-numeric:tabular-nums;white-space:nowrap}

/* Erfolge */
.badges{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.badge{background:var(--card);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;box-shadow:var(--shadow)}
.badge .medal{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;background:var(--fill);color:var(--muted)}
.badge:not(.got){opacity:.55}
.badge.got .medal{background:linear-gradient(135deg,#FFCC00,#FF9500);color:#fff;box-shadow:0 4px 12px rgba(255,149,0,.35)}

/* Tab-Leiste mit Milchglas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tab{background:none;border:0;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.6875rem;font-weight:500;color:var(--muted);min-height:56px}
.tab svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--tint)}

/* Allgemein */
.pick{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border:0;border-radius:22px;padding:14px 16px;box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:var(--fg);padding:11px 18px;border-radius:99px;font-weight:600;font-size:.9375rem;max-width:90vw;z-index:40;box-shadow:0 8px 30px rgba(0,0,0,.18)}
.auth{max-width:420px;margin:0 auto;padding-top:28px}
.brandlogo{width:76px;height:76px;border-radius:17px;display:block;box-shadow:0 8px 24px rgba(179,0,27,.35)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--fill);border-radius:10px;padding:2px;gap:2px}
.seg button{border:0;background:none;border-radius:8px;padding:7px;font-weight:500;color:var(--fg);min-height:36px;font-size:.9375rem}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 2px 6px rgba(0,0,0,.12);font-weight:600}
.err{color:var(--danger);font-weight:600;margin:0} .ok{color:var(--tint);font-weight:600;margin:0}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.credit{font-size:.75rem;color:var(--muted);text-align:center}
.bodyphoto{position:relative;border-radius:20px;overflow:hidden;background:radial-gradient(ellipse at 50% 90%,#2a3033,#141718 70%);aspect-ratio:896/1776;max-height:560px;margin:0 auto;width:100%;max-width:300px}
.bodyphoto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.bodyphoto.noimg img{display:none}
.pring{position:absolute;height:3.2%;margin-top:-1.6%;border:2px solid rgba(255,59,77,.35);border-radius:50%}
.pring.on{border-color:#FF3B4D;box-shadow:0 0 12px rgba(255,59,77,.75),inset 0 0 6px rgba(255,59,77,.5)}
.plabel{position:absolute;transform:translateY(-50%);background:rgba(28,28,30,.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;border-radius:12px;padding:4px 9px;font-size:.6875rem;line-height:1.15;display:flex;flex-direction:column}
.plabel b{font-family:var(--display);font-size:.9375rem;font-weight:700}
.plabel.l{left:6px} .plabel.r{right:6px} .plabel.fat{left:6px}
@media (prefers-reduced-motion:no-preference){.task,.bar span,.progress span,.setbtn{transition:background .2s,border-color .2s,width .4s,transform .12s}}
</style>
</head>
